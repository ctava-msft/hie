spring:
  application:
    name: aks-medallion-${app.role}
  lifecycle:
    timeout-per-shutdown-phase: 45s
server:
  port: 8080
  shutdown: graceful
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
app:
  role: ${MEDALLION_ROLE:}
  event-hubs-namespace: ${EVENT_HUBS_NAMESPACE:}
  event-hub-name: ${EVENT_HUB_NAME:hie-events}
  event-hub-consumer-group: ${EVENT_HUB_CONSUMER_GROUP:aks-medallion}
  service-bus-namespace: ${SERVICE_BUS_NAMESPACE:}
  bronze-queue: ${BRONZE_QUEUE:bronze-ready}
  silver-queue: ${SILVER_QUEUE:silver-ready}
  storage-account-url: ${STORAGE_ACCOUNT_URL:}
  bronze-container: ${BRONZE_CONTAINER:bronze}
  silver-container: ${SILVER_CONTAINER:silver}
  checkpoint-container: ${CHECKPOINT_CONTAINER:eventhub-checkpoints}
  quarantine-container: ${QUARANTINE_CONTAINER:quarantine}
  gold-backend: ${GOLD_BACKEND:adx}
  hapi-gold-url: ${HAPI_GOLD_URL:}
  hapi-gold-token: ${HAPI_GOLD_TOKEN:}
  silver-hapi-enabled: ${SILVER_HAPI_ENABLED:false}
  hapi-silver-url: ${HAPI_SILVER_URL:}
  hapi-silver-token: ${HAPI_SILVER_TOKEN:}
  patient-identifier-system: ${PATIENT_IDENTIFIER_SYSTEM:}
  adx-ingestion-url: ${ADX_INGESTION_URL:}
  adx-database: ${ADX_DATABASE:hie_gold}
  gold-table: ${GOLD_TABLE:GoldEvent}
  max-message-bytes: ${MAX_MESSAGE_BYTES:1048576}
  worker-concurrency: ${WORKER_CONCURRENCY:4}
  subscription-relay:
    enabled: ${SUBSCRIPTION_RELAY_ENABLED:false}
    queue: ${SUBSCRIPTION_RELAY_QUEUE:}
    token: ${SUBSCRIPTION_RELAY_TOKEN:}
    max-bytes: ${SUBSCRIPTION_RELAY_MAX_BYTES:131072}
