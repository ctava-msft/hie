apiVersion: v1
kind: Namespace
metadata:
  name: fhir
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hapi-fhir
  namespace: fhir
  annotations:
    azure.workload.identity/client-id: "__FHIR_IDENTITY_CLIENT_ID__"
    azure.workload.identity/tenant-id: "__TENANT_ID__"
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hapi-fhir
  namespace: fhir
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: hapi-fhir
  template:
    metadata:
      labels:
        app: hapi-fhir
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: hapi-fhir
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: hapi-fhir
      containers:
        - name: hapi-fhir
          image: "__IMAGE__"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GOLD_QUERY_URI
              value: "__GOLD_QUERY_URI__"
            - name: GOLD_DATABASE
              value: "__GOLD_DATABASE_NAME__"
            - name: FHIR_BASE_URL
              value: "__FHIR_BASE_URL__"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 30
            timeoutSeconds: 25
            failureThreshold: 2
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hapi-fhir
  namespace: fhir
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    service.beta.kubernetes.io/azure-load-balancer-internal-subnet: "__AKS_SUBNET_NAME__"
    service.beta.kubernetes.io/azure-load-balancer-ipv4: "__FHIR_PRIVATE_IP__"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  loadBalancerSourceRanges:
    - "__APIM_SUBNET_CIDR__"
  selector:
    app: hapi-fhir
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hapi-fhir-ingress
  namespace: fhir
spec:
  podSelector:
    matchLabels:
      app: hapi-fhir
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - ipBlock:
            cidr: "__APIM_SUBNET_CIDR__"
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hapi-fhir
  namespace: fhir
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: hapi-fhir
